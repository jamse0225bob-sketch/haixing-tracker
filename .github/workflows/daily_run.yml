name: Daily Run fetch_haixing

on:
  workflow_dispatch: # 保留这个开关，方便你随时手动测试
  schedule:
    # A股收盘为北京时间15:00。
    # 我们设定在 UTC 07:15 (即北京时间 15:15) 触发运行。
    # 1-5 代表周一到周五运行 (规避周末无效消耗)。
    - cron: '15 7 * * 1-5'
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install tushare requests pandas

      - name: Run script
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python fetch_haixing.py
