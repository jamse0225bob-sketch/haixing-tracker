name: Push Stock Data to Google Sheets

on:
  schedule:
    # 北京时间每个交易日 15:15 自动触发运行 (UTC 时间 07:15)
    - cron: '15 7 * * 1-5'
  workflow_dispatch: # 允许你在 GitHub 界面随时点击手动运行测试

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install akshare requests pandas

      - name: Run script
        run: python fetch_haixing.py
